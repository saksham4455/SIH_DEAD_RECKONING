name: sih_dead_reckoning
description: "SIH26168 - High-Precision Vehicle Navigation System using Dead Reckoning, Multi-GNSS/NavIC, and Edge AI"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  intl: ^0.19.0
  ffi: ^2.1.3
  flutter_map: ^7.0.2
  sensors_plus: ^6.1.1
  tflite_flutter: ^0.12.1
  geolocator: ^13.0.1
  shared_preferences: ^2.3.3
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/maps/
    - assets/maps/tiles/
    - assets/maps/tiles/13/5851/
    - assets/maps/tiles/13/5852/
    - assets/maps/tiles/13/5853/
    - assets/maps/tiles/14/11704/
    - assets/maps/tiles/14/11705/
    - assets/maps/tiles/14/11706/
    - assets/maps/tiles/15/23410/
    - assets/maps/tiles/15/23411/
    - assets/maps/tiles/15/23412/
    - assets/maps/tiles/16/46822/
    - assets/maps/tiles/16/46823/
    - assets/maps/tiles/16/46824/
    - assets/icons/
    - assets/config/
