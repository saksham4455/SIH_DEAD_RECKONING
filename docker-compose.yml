services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      SIH_DATABASE_URL: postgresql+asyncpg://sih:sih@db:5432/sih
      SIH_REDIS_URL: redis://cache:6379/0
      SIH_S3_ENDPOINT_URL: http://minio:9000
      SIH_S3_BUCKET: idr-models
      SIH_S3_ACCESS_KEY: minioadmin
      SIH_S3_SECRET_KEY: minioadmin
    depends_on:
      - db
      - cache
      - minio

  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: sih
      POSTGRES_USER: sih
      POSTGRES_PASSWORD: sih
    volumes:
      - postgres_data:/var/lib/postgresql/data

  cache:
    image: redis:7-alpine

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
